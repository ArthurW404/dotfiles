# ~/.config/tmux/tmux.conf
# Modern, ergonomic tmux configuration with truecolor and vi navigation

# Terminal & colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# Mouse support
set -g mouse on

# Window & pane index base 1 (easier to reach on keyboard numbers)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reduce escape delay for responsive vim mode switching
set -s escape-time 10

# Increase history limit
set -g history-limit 10000

# Vi keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Vim-like pane switching (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes in current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Easy reload of tmux config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
