# ~/.config/tmux/tmux.conf
# Modern, ergonomic and aesthetic tmux configuration with truecolor and vi navigation

# Terminal & colors (truecolor support)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# Mouse support
set -g mouse on

# Window & pane index base 1 (easier to reach on keyboard numbers)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reduce escape delay for responsive vim mode switching
set -s escape-time 10

# Increase history limit
set -g history-limit 10000

# Vi keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Vim-like pane switching (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes in current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Easy reload of tmux config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ------------------------------------------------------------------------------
# Aesthetic Status Bar & Borders (Catppuccin Mocha inspired)
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Left side: Session name pill
set -g status-left-length 40
set -g status-left "#[fg=#181825,bg=#89b4fa,bold] #S #[bg=#181825,fg=#89b4fa] "

# Window status tabs
set -g window-status-format "#[fg=#6c7086,bg=#181825] #I:#W "
set -g window-status-current-format "#[fg=#181825,bg=#cba6f7,bold] #I:#W #[default]"
set -g window-status-separator ""

# Right side: Path & Clock
set -g status-right-length 80
set -g status-right "#[fg=#89dceb]#(basename #{pane_current_path}) #[fg=#45475a]│ #[fg=#fab387]%H:%M #[fg=#6c7086]%d-%b "
