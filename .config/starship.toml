# ~/.config/starship.toml
# Sleek, minimalist cross-shell prompt (Fish, Zsh, Bash)
# Uses universal Unicode glyphs so no patched Nerd Font is required

format = """
$username$hostname$directory$git_branch$git_status$package$python$rust$nodejs$cmd_duration
$character"""

# Timeout for commands executed by starship (in ms)
command_timeout = 500

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold blue"
read_only = " [RO]"
read_only_style = "red"

[git_branch]
symbol = "⎇ "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

[python]
symbol = "py:"
style = "yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = "rs:"
style = "bold red"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "node:"
style = "bold green"
format = "[$symbol($version )]($style)"

[package]
disabled = true

[username]
show_always = false
style_user = "cyan"
format = "[$user]($style_user)@"

[hostname]
ssh_only = true
style = "magenta"
format = "[$hostname]($style) "
